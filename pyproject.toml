[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infopt"
version = "0.1.0"
description = "Measured LLM inference optimisation: quantisation, attention kernels, torch.compile, speculative decoding, KV-cache math and vLLM continuous batching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gpu = ["torch>=2.4", "transformers>=4.45", "accelerate>=0.30", "bitsandbytes>=0.43", "datasets>=2.18", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
