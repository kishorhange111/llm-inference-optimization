# vLLM serving profile: Qwen2.5-7B-Instruct AWQ + FP8 KV cache on 1x A100-40GB / L4
engine: vllm
model: Qwen/Qwen2.5-7B-Instruct-AWQ
quantization: awq
kv_cache_dtype: fp8
gpu_memory_utilization: 0.90
enable_prefix_caching: true
enable_chunked_prefill: true
max_model_len: 4096
max_num_seqs: 64
max_num_batched_tokens: 4096
speculative_decoding:
  enabled: false
  draft_model: Qwen/Qwen2.5-0.5B-Instruct
  num_speculative_tokens: 5
slo_targets:
  ttft_p95_ms: 350
  tpot_p95_ms: 35
  min_output_tok_s: 800
