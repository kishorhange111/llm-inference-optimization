name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  benchmark-smoke-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run CPU Smoke Benchmark & Regression Gate
        run: |
          python -m infopt.regression_cli run --output /tmp/smoke_candidate.json --markdown /tmp/smoke_report.md
          python -m infopt.regression_cli compare --baseline results/smoke_baseline.json --candidate /tmp/smoke_candidate.json --max-regression-pct 10
          cat /tmp/smoke_report.md >> "$GITHUB_STEP_SUMMARY"
